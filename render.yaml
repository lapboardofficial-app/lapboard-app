services:
  - type: web
    name: lapboard
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: HOST
        value: 0.0.0.0
      - key: LAPBOARD_DB_PATH
        value: /var/data/lapboard-db.json
      - key: LAPBOARD_SERVE_STATIC
        value: "true"
      - key: LAPBOARD_WRITE_RATE_LIMIT
        value: "120"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    disks:
      - name: lapboard-data
        mountPath: /var/data
        sizeGB: 1
